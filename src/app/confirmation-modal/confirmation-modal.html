<div class="confirm-modal">
  <div class="backdrop" (click)="onAnnulla()"></div>
  <div class="modal-card">
    <h3 class="modal-title inter-bold">{{ titolo }}</h3>
    <p class="modal-message inter-regular">{{ messaggio }}</p>
    <div class="modal-actions d-flex gap-2 justify-content-center align-items-center w-100">
      <button class="btn-red btn-actions-custom" (click)="onAnnulla()">
        {{ testoAnnulla }}
      </button>
      <button class="btn-green btn-actions-custom" (click)="onProcedi()">
        {{ testoProcedi }}
      </button>
    </div>
  </div>
</div>
