<div class="fonte-modal">
    <div class="backdrop" (click)="close()"></div>

    <div class="modal-content">

        <!-- BTN CHIUDI MODALE -->
        <div class="d-flex justify-content-start align-items-center gap-3 mb-3">
            <i class="ri-arrow-left-s-line btn-back fs-3 btn-red" (click)="close()"></i>
            <span>{{path}}</span>
        </div>

        <!-- TITOLO -->
        <h1>{{ fonte.titolo }}</h1>

        <!-- SECOLO - ANNO -->
        <p>{{ fonte.secolo }}&deg; Secolo - Anno {{ fonte.anno }}</p>

        <!-- RIFERIMENTO -->
        <h2>{{ fonte.riferimento}}</h2>

        <!-- TRASCRIZIONE -->
        <p>{{ fonte.trascrizione}}</p>

    </div>
</div>
